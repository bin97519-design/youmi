server:
  port: 8080

spring:
  application:
    name: youmi-api
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/youmi_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}
  sql:
    init:
      mode: always
      encoding: utf-8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

youmi:
  verification:
    public-base-url: ${YOUMI_VERIFICATION_PUBLIC_BASE_URL:https://101.133.149.214/youmi-api}
  file:
    upload-dir: ${YOUMI_FILE_UPLOAD_DIR:uploads}
    public-prefix: ${YOUMI_FILE_PUBLIC_PREFIX:/uploads}
  report-file:
    base-path: ${DATA_CAPTURE_REPORT_BASE_PATH:/opt/projects/data-capture-report}
  oss:
    enabled: ${OSS_ENABLED:true}
    endpoint: ${OSS_ENDPOINT:oss-cn-shanghai.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:huami-canvas}
    public-base-url: ${OSS_PUBLIC_BASE_URL:https://huami-canvas.oss-cn-shanghai.aliyuncs.com}
    sts-role-arn: ${OSS_STS_ROLE_ARN:}
    sts-endpoint: ${OSS_STS_ENDPOINT:sts.cn-shanghai.aliyuncs.com}
    cors-auto-configure: ${OSS_CORS_AUTO_CONFIGURE:true}
  auth:
    token-ttl-seconds: 604800
  credentials:
    require-https: ${YOUMI_CREDENTIAL_REQUIRE_HTTPS:true}
    master-key: ${YOUMI_CREDENTIAL_MASTER_KEY:}
    master-key-version: ${YOUMI_CREDENTIAL_MASTER_KEY_VERSION:v1}
  image:
    base-url: https://api.apimart.ai
    generation-path: /v1/images/generations
    task-path: /v1/tasks
    api-key: ${YOUMI_IMAGE_API_KEY:${APIMART_API_KEY:${APIMART_IMAGE_API_KEY:}}}
    proxy-base-url: ${PROXY_BASE_URL:http://47.90.226.52}
    proxy-api-key: ${IMAGE_PROXY_API_KEY:${PROXY_AUTH_TOKEN:}}
    proxy-generation-path: ${PROXY_GENERATION_PATH:/api/images/jobs}
    proxy-task-path: ${PROXY_TASK_PATH:/api/images/jobs}
    apimart-direct-base-url: ${YOUMI_IMAGE_APIMART_DIRECT_BASE_URL:https://apib.ai}
    apimart-direct-api-key: ${YOUMI_IMAGE_APIMART_DIRECT_API_KEY:${YOUMI_IMAGE_API_KEY:${APIMART_API_KEY:${APIMART_IMAGE_API_KEY:}}}}
    apimart-direct-generation-path: ${YOUMI_IMAGE_APIMART_DIRECT_GENERATION_PATH:/v1/images/generations}
    apimart-direct-task-path: ${YOUMI_IMAGE_APIMART_DIRECT_TASK_PATH:/v1/tasks}
    teamorouter-base-url: ${TEAMOROUTER_IMAGE_BASE_URL:https://api.teamorouter.cn/v1}
    teamorouter-api-key: ${TEAMOROUTER_IMAGE_API_KEY:${TEAMOROUTER_API_KEY:}}
    teamorouter-generation-path: ${TEAMOROUTER_IMAGE_GENERATION_PATH:/images/generations}
    teamorouter-edits-path: ${TEAMOROUTER_IMAGE_EDITS_PATH:/images/edits}
    wave-speed-base-url: ${WAVESPEED_BASE_URL:https://api.wavespeed.ai/api/v3}
    wave-speed-api-key: ${WAVESPEED_API_KEY:}
    wave-speed-multi-angle-model: ${WAVESPEED_MULTI_ANGLE_MODEL:wavespeed-ai/qwen-image/edit-multiple-angles}
    fallback-enabled: ${YOUMI_IMAGE_FALLBACK_ENABLED:true}
    get-token-base-url: https://nb.gettoken.cn/openapi/v1
    get-token-api-key: ${GETTOKEN_API_KEY:${YOUMI_GETTOKEN_API_KEY:}}
    get-token-query-path: /query
    lk888-base-url: ${LK888_BASE_URL:https://api.lk888.ai}
    lk888-api-key: ${LK888_API_KEY:${AIGC_AGGREGATOR_API_KEY:}}
    lk888-generation-path: ${LK888_GENERATION_PATH:/v1/media/generate}
    lk888-task-path: ${LK888_TASK_PATH:/v1/media/status}
    model: gpt-image-2
    default-size: "9:16"
    default-resolution: 2K
    language: zh
    persist-generated-images: true
    upload-endpoint: http://101.133.149.214/youmi-api/api/v1/file/upload
    upload-field-name: file
    timeout-seconds: 60
    upload-timeout-seconds: 120
  video:
    base-url: ${THQ_VIDEO_BASE_URL:https://new.thqllm.com/v1}
    api-key: ${THQ_VIDEO_API_KEY:}
    timeout-seconds: ${THQ_VIDEO_TIMEOUT_SECONDS:120}
    download-timeout-seconds: ${THQ_VIDEO_DOWNLOAD_TIMEOUT_SECONDS:600}
    persist-generated-videos: ${THQ_VIDEO_PERSIST_GENERATED:true}
    chat-api-key: ${THQ_CHAT_VIDEO_API_KEY:}
    chat-base-url: ${THQ_CHAT_VIDEO_BASE_URL:https://new.thqllm.com/v1}
    chat-timeout-seconds: ${THQ_CHAT_VIDEO_TIMEOUT_SECONDS:1200}
  video-enhance:
    base-url: ${VIDEO_ENHANCE_BASE_URL:https://api.lk888.ai}
    api-key: ${VIDEO_ENHANCE_API_KEY:}
    base-mi-per-second: ${VIDEO_ENHANCE_BASE_MI_PER_SECOND:0.2}
    max-input-bytes: ${VIDEO_ENHANCE_MAX_INPUT_BYTES:536870912}
    max-output-bytes: ${VIDEO_ENHANCE_MAX_OUTPUT_BYTES:2147483648}
  minimax-video:
    base-url: ${MINIMAX_VIDEO_BASE_URL:https://api.lk888.ai}
    api-key: ${MINIMAX_VIDEO_API_KEY:}
    timeout-seconds: ${MINIMAX_VIDEO_TIMEOUT_SECONDS:120}
    mi-per-second-by-resolution:
      768p: ${MINIMAX_VIDEO_MI_PER_SECOND_768P:5}
      1080p: ${MINIMAX_VIDEO_MI_PER_SECOND_1080P:10}
      2k: ${MINIMAX_VIDEO_MI_PER_SECOND_2K:15}
      4k: ${MINIMAX_VIDEO_MI_PER_SECOND_4K:30}
    persist-generated-videos: ${MINIMAX_VIDEO_PERSIST_GENERATED:true}
  anmiao-video:
    base-url: ${ANMIAO_VIDEO_BASE_URL:https://api.lk888.ai/api/v3/anmiao}
    api-key: ${ANMIAO_VIDEO_API_KEY:}
    api-key-20: ${ANMIAO_VIDEO_20_API_KEY:}
    api-key-25: ${ANMIAO_VIDEO_25_API_KEY:}
    timeout-seconds: ${ANMIAO_VIDEO_TIMEOUT_SECONDS:120}
    mi-per-second: ${ANMIAO_VIDEO_MI_PER_SECOND:5}
    mi-per-second-by-resolution:
      480p: ${ANMIAO_VIDEO_MI_PER_SECOND_480P:3}
      720p: ${ANMIAO_VIDEO_MI_PER_SECOND_720P:0}
      1080p: ${ANMIAO_VIDEO_MI_PER_SECOND_1080P:10}
      4k: ${ANMIAO_VIDEO_MI_PER_SECOND_4K:20}
    mi-per-second-25-by-resolution:
      480p: ${ANMIAO_VIDEO_25_MI_PER_SECOND_480P:4}
      720p: ${ANMIAO_VIDEO_25_MI_PER_SECOND_720P:7}
      1080p: ${ANMIAO_VIDEO_25_MI_PER_SECOND_1080P:14}
    persist-generated-videos: ${ANMIAO_VIDEO_PERSIST_GENERATED:true}
  credit:
    prices:
      IMAGE: 10
      VIDEO: 50
    image-prices:
      banana2:
        1K: 8
        2K: 9
        4K: 12
      banana-pro:
        1K: 13
        2K: 15
        4K: 21
      "[banana-2.1]":
        1K: 8
        2K: 9
        4K: 12
      gpt-image-2:
        1K: 6
        2K: 10
        4K: 15
      "[gpt-image-2.5-sunburst]":
        1K: 11
        2K: 11
        4K: 18
      qwen-multi-angle:
        1K: 20
        2K: 20
        4K: 20
  dashscope:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen3.7-plus
    max-tokens: 4000
    temperature: 0.2
    timeout-seconds: 60
  agent-chat:
    base-url: ${YOUMI_AGENT_BASE_URL:https://api.teamorouter.cn/v1}
    chat-path: ${YOUMI_AGENT_CHAT_PATH:/chat/completions}
    api-key: ${YOUMI_AGENT_API_KEY:}
    model: ${YOUMI_AGENT_MODEL:gpt-5.6-luna}
    max-tokens: ${YOUMI_AGENT_MAX_TOKENS:4000}
    temperature: ${YOUMI_AGENT_TEMPERATURE:0.2}
    timeout-seconds: ${YOUMI_AGENT_TIMEOUT_SECONDS:90}
  gem-agent:
    base-url: ${GEM_AGENT_BASE_URL:https://api.lk888.ai}
    api-key: ${GEM_AGENT_API_KEY:}
    timeout-seconds: ${GEM_AGENT_TIMEOUT_SECONDS:120}
    max-tokens: ${GEM_AGENT_MAX_TOKENS:8000}
  xfyun:
    base-url: ${XFYUN_VISION_BASE_URL:https://maas-coding-api.cn-huabei-1.xf-yun.com/v2}
    chat-path: ${XFYUN_VISION_CHAT_PATH:/chat/completions}
    api-key: ${XFYUN_VISION_API_KEY:${XFYUN_API_KEY:${SPARK_API_KEY:}}}
    model: ${XFYUN_VISION_MODEL:xopkimik26}
    max-tokens: ${XFYUN_VISION_MAX_TOKENS:4000}
    temperature: ${XFYUN_VISION_TEMPERATURE:0.0}
    timeout-seconds: ${XFYUN_VISION_TIMEOUT_SECONDS:60}
  ecommerce-set:
    max-concurrent: 3
    retry-count: 2
    default-model: gpt-image-2
    planning-model: qwen3.7-plus
    poll-interval-ms: 2000

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生图圆点动效 · 隔离视觉校准</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        font:
          14px/1.6 system-ui,
          sans-serif;
        color: #d3d5d8;
        background: #111214;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 500;
      }
      p {
        margin: 0 0 28px;
        color: #9a9da3;
        font-size: 12px;
      }
      .samples {
        display: flex;
        align-items: flex-start;
        gap: 48px;
        flex-wrap: wrap;
      }
      figure {
        margin: 0;
      }
      .dot-preview {
        position: relative;
        overflow: hidden;
        border-radius: 16px;
      }
      .dot-preview.compact {
        width: 178px;
        height: 178px;
      }
      .dot-preview.wide {
        width: min(624px, calc(100vw - 80px));
        aspect-ratio: 16 / 9;
      }
      figcaption {
        margin-top: 14px;
        color: #8d929a;
        font-size: 12px;
      }
      .record-tools {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 32px;
        color: #9a9da3;
        font-size: 12px;
      }
      button {
        padding: 8px 12px;
        border: 1px solid #36393e;
        border-radius: 8px;
        background: #242527;
        color: #c3c7ce;
        cursor: pointer;
      }
      a {
        color: #b9bfc8;
      }
    </style>
  </head>
  <body>
    <h1>生图圆点动效</h1>
    <p>持续动画预览 · 不连接生成服务，不提交任务、不扣费</p>
    <div id="app"></div>
    <div class="record-tools">
      <button type="button" id="record">录制4秒动效</button>
      <span role="status" id="record-status"></span>
      <a id="record-download" hidden>下载动效预览</a>
    </div>
    <script type="module">
      import { createApp, h } from 'vue'
      import GenerationPixelField from '../../src/features/canvas-v3/components/GenerationPixelField.vue'

      createApp({
        render: () =>
          h('section', { class: 'samples', 'aria-label': '圆点动效预览' }, [
            h('figure', [
              h('div', { class: 'dot-preview compact' }, [
                h(GenerationPixelField, { seed: 'reference-dot-preview' }),
              ]),
              h('figcaption', '178 × 178 · 参考图尺寸'),
            ]),
            h('figure', [
              h('div', { class: 'dot-preview wide' }, [
                h(GenerationPixelField, { seed: 'reference-dot-preview' }),
              ]),
              h('figcaption', '16:9 · 画布节点尺寸'),
            ]),
          ]),
      }).mount('#app')

      const button = document.querySelector('#record')
      const status = document.querySelector('#record-status')
      const download = document.querySelector('#record-download')
      button.addEventListener('click', () => {
        const canvas = document.querySelector('.compact canvas')
        if (!canvas?.captureStream || !window.MediaRecorder) {
          status.textContent = '当前浏览器不支持录制，页面动效仍可正常预览'
          return
        }
        // captureStream does not include the canvas element's CSS background.
        // Composite that same rendered surface so the recording matches the UI.
        const recording = document.createElement('canvas')
        recording.width = canvas.width
        recording.height = canvas.height
        const context = recording.getContext('2d')
        const surface = getComputedStyle(canvas.parentElement).backgroundColor
        let frame
        const draw = () => {
          context.fillStyle = surface
          context.fillRect(0, 0, recording.width, recording.height)
          context.drawImage(canvas, 0, 0)
          frame = requestAnimationFrame(draw)
        }
        draw()
        const stream = recording.captureStream(15)
        const chunks = []
        const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
          ? 'video/webm;codecs=vp9'
          : 'video/webm'
        const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 })
        recorder.ondataavailable = (event) => {
          if (event.data.size) chunks.push(event.data)
        }
        recorder.onstop = () => {
          cancelAnimationFrame(frame)
          stream.getTracks().forEach((track) => track.stop())
          if (download.href.startsWith('blob:')) URL.revokeObjectURL(download.href)
          download.href = URL.createObjectURL(new Blob(chunks, { type: mimeType }))
          download.download = 'generation-dots-motion-preview.webm'
          download.hidden = false
          button.disabled = false
          status.textContent = '已录制真实页面圆点变化（4秒）'
        }
        download.hidden = true
        button.disabled = true
        status.textContent = '正在录制圆点动画…'
        recorder.start()
        setTimeout(() => recorder.stop(), 4000)
      })
    </script>
  </body>
</html>
